<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KHIP OS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <div><span class="mark">A</span><strong>KHIP OS</strong><span id="version">connecting</span></div>
      <button id="privacy" class="status"><span></span>Local mode</button>
    </header>
    <section class="hero">
      <p class="eyebrow">YOUR WORKING PARTNER</p>
      <h1>What are we building?</h1>
      <p>Speak naturally or type a request. I will choose a specialist, form a plan, and pause before consequential actions.</p>
    </section>
    <section class="composer">
      <textarea id="intent" rows="3" placeholder="Create a Python project for monitoring PLC tags…"></textarea>
      <div class="controls">
        <button id="listen" class="mic" aria-pressed="false">● <span>Start listening</span></button>
        <button id="send" class="primary">Plan task →</button>
      </div>
      <p id="mic-note" class="note">Microphone is off.</p>
      <div class="meter" aria-label="Microphone level">
        <div class="meter-row">
          <span>Mic level</span>
          <output id="mic-db">idle</output>
        </div>
        <div class="meter-track">
          <div id="mic-level" class="meter-fill"></div>
          <div id="mic-peak" class="meter-peak"></div>
        </div>
        <p id="mic-health" class="note">Start listening to check input level.</p>
      </div>
    </section>
    <section id="result" class="result hidden" aria-live="polite"></section>
    <section class="lower">
      <div>
        <h2>Specialists</h2>
        <div id="agents" class="agents"></div>
      </div>
      <aside>
        <h2>Projects</h2>
        <form id="project-form"><input id="project-name" placeholder="New project name" required><button>Create</button></form>
        <ul id="projects"></ul>
      </aside>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
